name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          # Remove this once rankify.com.au DNS is cut over to point here —
          # a custom domain serves from the root and no basePath is needed.
          NEXT_PUBLIC_BASE_PATH: /rankify-com-au
          # Public by design: this key can only deliver to the address it's
          # registered to, and it ships in the client bundle either way.
          NEXT_PUBLIC_WEB3FORMS_KEY: 2e24e577-1645-43a6-98f7-cb7ea581df5b
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
